name: Teethmark
description: Fail a pull request if its tests got weaker than the ledger on the base branch.
branding:
  icon: shield
  color: red
inputs:
  baseline-ref:
    description: Git ref holding the trusted ledger, e.g. origin/main. Empty = ledger in the working tree.
    default: ""
  root:
    description: Project folder.
    default: "."
  args:
    description: Extra arguments for `teethmark check`.
    default: ""
  review-ok:
    description: Set to "true" to let a REVIEW verdict pass.
    default: "false"
runs:
  using: composite
  steps:
    - name: Install teethmark
      shell: bash
      run: python -m pip install --quiet "${{ github.action_path }}"
    - name: Check that the tests did not get weaker
      shell: bash
      env:
        BASELINE_REF: ${{ inputs.baseline-ref }}
        ROOT: ${{ inputs.root }}
        EXTRA: ${{ inputs.args }}
        REVIEW_OK: ${{ inputs.review-ok }}
      run: |
        flags=()
        if [ -n "$BASELINE_REF" ]; then flags+=(--baseline-ref "$BASELINE_REF"); fi
        if [ "$REVIEW_OK" = "true" ]; then flags+=(--review-ok); fi
        set +e
        python -m teethmark check --root "$ROOT" --format markdown --output "$RUNNER_TEMP/teethmark.md" "${flags[@]}" $EXTRA
        code=$?
        set -e
        if [ -f "$RUNNER_TEMP/teethmark.md" ]; then cat "$RUNNER_TEMP/teethmark.md" >> "$GITHUB_STEP_SUMMARY"; fi
        exit $code
