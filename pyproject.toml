[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "teethmark"
version = "0.1.0"
description = "Prove that a test suite did not get weaker: a ratchet over the bugs your tests used to catch."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Gagan Ramesh" }]
keywords = ["testing", "mutation-testing", "ai-agents", "ci", "pytest", "quality-gate"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
teethmark = "teethmark.cli:main"

[project.urls]
Homepage = "https://github.com/gaganramesh-git/teethmark"

[tool.setuptools]
packages = ["teethmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
